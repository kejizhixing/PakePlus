<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Music & Video Player - By HAISNAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            important: true,
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00FFFF',
                        'neon-pink': '#FF00FF',
                        'neon-purple': '#9D00FF',
                        'dark-bg': '#0a0a0a',
                        'dark-card': '#1a1a1a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center overflow-hidden">
    <div class="player-container w-full h-screen rounded-none overflow-hidden flex" style="position: relative; z-index: 1;">
        
        <div class="playlist w-full md:w-80 flex flex-col min-w-[280px] max-w-[350px]">
            <div class="p-6 border-b border-neon-blue/20" style="background: linear-gradient(135deg, rgba(18, 18, 18, 0.98), rgba(30, 30, 30, 0.95)); backdrop-filter: blur(20px);">
                <h2 class="text-2xl font-bold mb-4 text-neon-blue flex items-center gap-2">
                    <span class="text-3xl">🎵</span>
                    播放列表
                </h2>
                <input type="file" id="fileInput" accept="audio/*,video/*" multiple class="hidden">
                <button id="uploadBtn" class="w-full px-6 py-4 rounded-2xl font-bold text-lg transition-all shadow-lg hover:shadow-2xl" style="background: linear-gradient(135deg, #00FFFF 0%, #00DDDD 100%); color: #000000 !important; border: 4px solid #00FFFF; box-shadow: 0 0 30px rgba(0, 255, 255, 0.9), 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.3); animation: pulse 2s ease-in-out infinite; font-size: 20px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 0, 0, 0.3); line-height: 1.3;">
                    ➕ 添加媒体文件
                </button>
            </div>
            <ul id="playlist" class="flex-1 overflow-y-auto p-4 space-y-2">
            </ul>
        </div>

        <div class="player flex-1 flex flex-col p-8" style="background: linear-gradient(135deg, rgba(18, 18, 18, 0.95), rgba(24, 24, 24, 0.9)); backdrop-filter: blur(20px);">
            
            <div class="media-container flex-1 flex items-center justify-center mb-8 rounded-3xl overflow-hidden relative shadow-inner">
                <video id="videoPlayer" controls class="hidden max-w-full max-h-full rounded-2xl shadow-2xl"></video>
                <audio id="audioPlayer" class="hidden"></audio>
                <div id="coverImage" class="hidden absolute w-48 h-48 md:w-60 md:h-60 lg:w-72 lg:h-72 rounded-full shadow-2xl" style="background: linear-gradient(135deg, #00FFFF, #FF00FF, #9D00FF);"></div>
                <div id="noMedia" class="text-center relative z-10">
                    <div class="text-9xl mb-6 opacity-30">🎼</div>
                    <p class="text-neon-blue text-2xl font-bold mb-2">准备好您的音乐之旅</p>
                    <p class="text-gray-400 text-base">点击上方按钮添加音频或视频文件</p>
                </div>
            </div>

            <div class="controls space-y-6 rounded-3xl p-8 shadow-xl border border-neon-blue/20" style="background: linear-gradient(135deg, rgba(18, 18, 18, 0.98), rgba(30, 30, 30, 0.95)); backdrop-filter: blur(20px);">
                
                <div class="progress-bar h-3 rounded-full overflow-hidden cursor-pointer relative shadow-inner">
                    <div id="progress" class="h-full rounded-full transition-all"></div>
                </div>

                <div class="flex justify-between items-center text-sm font-semibold">
                    <span id="currentTime" class="font-mono px-3 py-1 rounded-lg text-neon-blue" style="background: rgba(0, 255, 255, 0.1);">0:00</span>
                    <span id="duration" class="font-mono px-3 py-1 rounded-lg text-neon-blue" style="background: rgba(0, 255, 255, 0.1);">0:00</span>
                </div>

                <div class="flex justify-center items-start gap-8 py-0 px-6 rounded-2xl" style="background: rgba(0, 0, 0, 0.4); border: 2px solid #00FFFF; box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.1); min-height: 120px; padding-top: -4px;">
                    <button id="prevBtn" class="control-btn" style="margin-top: -16px;">
                        <span>⏮</span>
                        <span>上一曲</span>
                    </button>
                    <button id="stopBtn" class="control-btn" style="background: linear-gradient(135deg, #FF00FF, #DD00DD) !important; border-color: #FF00FF !important; margin-top: -16px;">
                        <span>⏹</span>
                        <span>停止</span>
                    </button>
                    <button id="playBtn" class="control-btn" style="margin-top: -16px;">
                        <span>▶</span>
                        <span>播放</span>
                    </button>
                    <button id="nextBtn" class="control-btn" style="margin-top: -16px;">
                        <span>⏭</span>
                        <span>下一曲</span>
                    </button>
                </div>

                <div class="flex justify-between items-center pt-3 border-t border-neon-blue/20">
                    <button id="loopBtn" class="feature-btn" title="循环播放">
                        <span class="text-2xl">🔁</span>
                        <span class="text-xs font-medium">循环</span>
                    </button>
                    
                    <div class="flex items-center space-x-4 px-6 py-3 rounded-2xl shadow-md" style="background: linear-gradient(135deg, #00FFFF, #00DDDD); border: 3px solid #00FFFF; box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);">
                        <span class="text-2xl">🔊</span>
                        <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.7" class="w-40" title="音量 (↑/↓)">
                        <span class="text-sm font-bold w-12 text-center" id="volumePercent">70%</span>
                    </div>
                    
                    <button id="shuffleBtn" class="feature-btn" title="随机播放">
                        <span class="text-2xl">🔀</span>
                        <span class="text-xs font-medium">随机</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        const particleCount = 150;
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                const colors = ['#00FFFF', '#FF00FF', '#9D00FF', '#00FF88'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.3;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }
        }
        
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
